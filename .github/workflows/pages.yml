name: Deploy Pages

# Builds the bilingual install guide (guide/template.html + guide/img → docs/index.html)
# and deploys it to GitHub Pages. Repo setting required: Settings → Pages → Source = GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "guide/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build guide → docs/index.html
        run: python guide/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
